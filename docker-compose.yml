version: "3.9"

services:
  llm:
    build: ./llm
    container_name: local-llm
    environment:
      - MODEL_PATH=/models/model.gguf
      - CONTEXT_SIZE=4096
      - N_THREADS=6
      - GPU_LAYERS=0
      - LLM_PORT=8000
    volumes:
      - ./models/llm:/models
    ports:
      - "8000:8000"

  tts:
    build: ./tts
    container_name: local-tts
    environment:
      - VOICE_MODEL=/models/voice.onnx
      - VOICE_CONFIG=/models/voice.onnx.json
      - TTS_PORT=8001
    volumes:
      - ./models/tts:/models
    ports:
      - "8001:8001"
